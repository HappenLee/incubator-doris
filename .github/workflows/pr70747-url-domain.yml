name: PR 70747 ARM URL extraction benchmark
on:
  push:
    branches: [ci/pr70747-url-domain]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-14, clang++-20]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Fetch exact baseline and PR head
        run: |
          git fetch --no-tags --depth=1 https://github.com/apache/doris.git fda8d83426ae45bdf1bfef2f331846bbe9af7826 edc6f74cf8a1ca28890a390a115830fad997a521
      - name: Install test dependencies
        run: |
          if [ "${{ matrix.compiler }}" = clang++-20 ]; then
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
            echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-20 main' | sudo tee /etc/apt/sources.list.d/llvm20.list
          fi
          sudo apt-get update -qq
          sudo apt-get install -y g++-14 libbenchmark-dev
          if [ "${{ matrix.compiler }}" = clang++-20 ]; then
            sudo apt-get install -y clang-20 libclang-rt-20-dev
          fi
      - name: Build and benchmark original and PR URL extractors
        run: bash build-support/pr70747-url-domain/run-arm.sh '${{ matrix.compiler }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr70747-url-domain-${{ matrix.compiler }}
          path: url-domain-results/
